name: M1 quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, smoke tests and production build
        run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ULTRA_NETWORK: testnet
